async function openCapsule() {

    authData.set(enc.encode("LOGICLASS"), 0); authData.set(salt, 9); authData.set(nonce, 25); authData.set(ct, 41);
    const valid = await crypto.subtle.verify("HMAC", hmacKey, mac, authData);
    if (!valid) throw new Error("Échec d'authentification HMAC : mot de passe incorrect ou fichier altéré.");

    // Déchiffrement CTR-SHA256 natif
    const ctrKey = await crypto.subtle.importKey("raw", encKey, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const pt = new Uint8Array(ct.length);
    let offset = 0, counter = 0n;
    while (offset < ct.length) {
      const ctrBuf = new ArrayBuffer(24);
      new Uint8Array(ctrBuf).set(nonce, 0);
      new DataView(ctrBuf).setBigUint64(16, counter, false);
      const block = new Uint8Array(await crypto.subtle.sign("HMAC", ctrKey, ctrBuf));
      for (let i = 0; i < block.length && offset < ct.length; i++, offset++) pt[offset] = ct[offset] ^ block[i];
      counter++;
    }

    // Décompression Zlib via DecompressionStream
    const ds = new DecompressionStream("deflate");
    const writer = ds.writable.getWriter();
    writer.write(pt); writer.close();
    const decompressed = await new Response(ds.readable).arrayBuffer();
    const jsonText = new TextDecoder().decode(decompressed);

    out.textContent = JSON.stringify(JSON.parse(jsonText), null, 2);
    out.style.display = "block";
    document.getElementById("btnPurge").style.display = "block";
  } catch (e) {
    msg.textContent = "[ERREUR] " + e.message;
  }
}
