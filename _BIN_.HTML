<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI23N — _BIN_.HTML (Zero-Trust WebCrypto Engine)</title>
<style>
  :root { --bg:#060a12; --card:#0f172a; --border:#1e293b; --accent:#38bdf8; --ok:#10b981; --err:#ef4444; --text:#e2e8f0; }
  * { box-sizing:border-box; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { background:var(--bg); color:var(--text); margin:0; padding:16px; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  h1 { color:var(--accent); font-size:1.15rem; margin:0 0 6px 0; }
  h2 { color:#94a3b8; font-size:0.95rem; margin:0 0 12px 0; text-transform:uppercase; letter-spacing:1px; }
  input[type="file"], input[type="password"], button {
    width:100%; padding:11px; margin:6px 0; border-radius:6px; border:1px solid #334155;
    background:#020617; color:#f8fafc; font-size:0.9rem;
  }
  button { background:#0284c7; border:none; font-weight:bold; cursor:pointer; transition:0.2s; }
  button:hover { background:#0369a1; }
  button.sec { background:#059669; }
  button.sec:hover { background:#047857; }
  .status { padding:10px; border-radius:6px; margin-top:10px; font-size:0.85rem; display:none; word-break:break-all; }
  .status.ok { display:block; background:#064e3b; border:1px solid var(--ok); color:#a7f3d0; }
  .status.err { display:block; background:#7f1d1d; border:1px solid var(--err); color:#fecaca; }
  pre { background:#020617; border:1px solid var(--border); padding:12px; border-radius:6px; overflow-x:auto; color:#a7f3d0; font-size:0.82rem; max-height:420px; }
  iframe { width:100%; height:480px; border:1px solid var(--border); border-radius:6px; background:#090d16; margin-top:10px; }
</style>
</head>
<body>

<div class="panel">
  <h1>AI23N — _BIN_.HTML (ZERO TRUST / OFFLINE)</h1>
  <small>Moteur WebCrypto AES-256-GCM + PBKDF2-SHA256 • Exécution 100% locale en RAM</small>
</div>

<!-- MODULE 1 : SCELLER EN .BIN -->
<div class="panel">
  <h2>1. Créer un conteneur chiffré (.BIN)</h2>
  <input type="file" id="srcFiles" multiple accept=".html,.htm,.json,.txt">
  <input type="password" id="encPwd" placeholder="Mot de passe maître AES-256-GCM">
  <button onclick="sealFiles()">CALCULER SHA-256 & GÉNÉRER .BIN</button>
  <div id="encStatus" class="status"></div>
</div>

<!-- MODULE 2 : DÉCHIFFRER & VISUALISER (.BIN / .ISO) -->
<div class="panel">
  <h2>2. Ouvrir & Vérifier un coffre (.BIN / .ISO)</h2>
  <input type="file" id="vaultFile" accept=".bin,.iso">
  <input type="password" id="decPwd" placeholder="Mot de passe de déchiffrement">
  <button class="sec" onclick="unlockVault()">VÉRIFIER INTÉGRITÉ & DÉCHIFFRER</button>
  <div id="decStatus" class="status"></div>
  <div id="outputArea" style="display:none; margin-top:14px;">
    <h2>Manifeste SHA-256 & Métadonnées</h2>
    <pre id="manifestView"></pre>
    <h2>Aperçu HTML Isolé (Sandbox)</h2>
    <iframe id="htmlSandbox" sandbox=""></iframe>
  </div>
</div>

<script>
const MAGIC_GCM = new TextEncoder().encode("AI23N_GCM_V4\x00\x00\x00\x00");

async function sha256Hex(buffer) {
  const hash = await crypto.subtle.digest("SHA-256", buffer);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function deriveAesKey(password, salt) {
  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 300000, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function sealFiles() {
  const files = document.getElementById("srcFiles").files;
  const pwd = document.getElementById("encPwd").value;
  const st = document.getElementById("encStatus");
  if (!files.length || !pwd) {
    st.className = "status err"; st.textContent = "[!] Sélectionnez au moins un fichier et entrez un mot de passe."; return;
  }
  try {
    const sources = {};
    const contents = {};
    for (const f of files) {
      const buf = await f.arrayBuffer();
      sources[f.name] = await sha256Hex(buf);
      contents[f.name] = new TextDecoder().decode(buf);
    }
    const bundle = {
      engine: "AI23N-_BIN_.HTML-V4",
      utc: new Date().toISOString(),
      total: files.length,
      sources,
      contents
    };
    const plaintext = new TextEncoder().encode(JSON.stringify(bundle));
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveAesKey(pwd, salt);
    const ciphertext = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plaintext));

    const out = new Uint8Array(MAGIC_GCM.length + salt.length + iv.length + ciphertext.length);
    out.set(MAGIC_GCM, 0);
    out.set(salt, 16);
    out.set(iv, 32);
    out.set(ciphertext, 44);

    const binHash = await sha256Hex(out.buffer);
    const blob = new Blob([out], { type: "application/octet-stream" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "AI23N_GCM_VAULT.bin";
    a.click();

    st.className = "status ok";
    st.textContent = `[OK] Conteneur généré (${files.length} fichier(s)) • SHA-256 : ${binHash}`;
  } catch (e) {
    st.className = "status err"; st.textContent = "[ERREUR] " + e.message;
  }
}

async function unlockVault() {
  const file = document.getElementById("vaultFile").files[0];
  const pwd = document.getElementById("decPwd").value;
  const st = document.getElementById("decStatus");
  if (!file || !pwd) {
    st.className = "status err"; st.textContent = "[!] Sélectionnez un fichier .bin/.iso et entrez le mot de passe."; return;
  }
  try {
    const raw = new Uint8Array(await file.arrayBuffer());
    const header = new TextDecoder().decode(raw.slice(0, 12));
    if (header !== "AI23N_GCM_V4") {
      throw new Error("Format non reconnu par le moteur WebCrypto V4 (utilisez un coffre créé via _BIN_.HTML).");
    }
    const salt = raw.slice(16, 32);
    const iv = raw.slice(32, 44);
    const ct = raw.slice(44);
    const key = await deriveAesKey(pwd, salt);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    const bundle = JSON.parse(new TextDecoder().decode(pt));

    const { contents, ...meta } = bundle;
    document.getElementById("manifestView").textContent = JSON.stringify(meta, null, 2);
    const firstHtml = Object.values(contents || {})[0] || "<p style='color:#fff'>Aucun contenu HTML</p>";
    document.getElementById("htmlSandbox").srcdoc = firstHtml;
    document.getElementById("outputArea").style.display = "block";

    st.className = "status ok";
    st.textContent = "[OK] Authentification GCM réussie • Contenu déchiffré en mémoire vive.";
  } catch (e) {
    st.className = "status err";
    st.textContent = "[ERREUR] Mot de passe incorrect ou fichier altéré.";
  }
}
</script>
</body>
</html>
